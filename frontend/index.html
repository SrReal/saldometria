<!doctype html>
<html class="light" lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaldoMetria</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#ff8404',
              dark: '#e67703',
            },
            secondary: '#64748b',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
  </style>
  <style type="text/tailwindcss">
    @layer utilities {
            .glass-modal {
                @apply bg-white/70  backdrop-blur-2xl border border-[#ff8404]/30;
            }
            .glass-input {
                @apply bg-white/50  border-[#dde3e2]  focus:border-primary focus:ring-1 focus:ring-primary transition-all;
            }
            .glass-panel {
              background: rgba(255, 255, 255, 0.8);
              backdrop-filter: blur(12px);
              -webkit-backdrop-filter: blur(12px);
          }
        }
        :root {
            --primary-color: #ff8404;
        }
    </style>
</head>

<body class="bg-background-light text-slate-900 min-h-screen transition-colors duration-200 font-sans">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
