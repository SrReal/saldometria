<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FinanceHub - Añadir Transacción</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff8404",
                        "primary-hover": "#e67600",
                        "background-light": "#fafafa",
                        "background-dark": "#121417",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-modal {
                @apply bg-white/70 dark:bg-black/60 backdrop-blur-2xl border border-[#ff8404]/30;
            }
            .glass-input {
                @apply bg-white/50 dark:bg-white/5 border-[#dde3e2] dark:border-gray-700 focus:border-primary focus:ring-1 focus:ring-primary transition-all;
            }
        }
        :root {
            --primary-color: #ff8404;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-[#121616] dark:text-white h-screen overflow-hidden flex flex-col relative antialiased">
    <div aria-hidden="true"
        class="flex-1 flex flex-col h-full filter blur-[8px] opacity-60 pointer-events-none select-none transition-all duration-300">
        <nav
            class="border-b border-[#dde3e2] dark:border-gray-700 bg-white dark:bg-[#1a1d21] px-6 py-4 flex justify-between items-center sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-primary/10 rounded-lg flex items-center justify-center text-primary">
                    <span class="material-symbols-outlined">dataset</span>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-base font-bold tracking-tight leading-none">FinanceHub</h1>
                    <span class="text-xs text-gray-500 font-medium">Business Dashboard</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-500">
                    <a class="text-[#121616] dark:text-white" href="#">Movimientos</a>
                    <a class="hover:text-primary transition-colors" href="#">Forecasting</a>
                    <a class="hover:text-primary transition-colors" href="#">Entities</a>
                </div>
                <div
                    class="w-9 h-9 rounded-full bg-gradient-to-tr from-primary to-orange-300 ring-2 ring-white dark:ring-gray-800">
                </div>
            </div>
        </nav>
        <main class="flex-1 p-8 overflow-y-auto bg-background-light dark:bg-background-dark">
            <div class="max-w-6xl mx-auto space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-[#121616] dark:text-white">Transacciones</h2>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Gestiona el efectivo y entradas
                            manuales.</p>
                    </div>
                </div>
                <div class="rounded-xl border border-[#dde3e2] dark:border-gray-700 bg-white dark:bg-[#1a1d21] h-96">
                </div>
            </div>
        </main>
    </div>
    <div
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm transition-all duration-300">
        <div
            class="w-full max-w-[640px] glass-modal rounded-2xl shadow-[0_32px_80px_-12px_rgba(0,0,0,0.3)] flex flex-col overflow-hidden animate-[fadeInZoom_0.3s_ease-out_forwards]">
            <div class="px-8 py-5 flex items-center justify-between border-b border-[#ff8404]/10">
                <h3 class="text-xl font-bold text-[#121616] dark:text-white tracking-tight">Añadir Transacción</h3>
                <button class="group p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                    <span
                        class="material-symbols-outlined text-gray-400 group-hover:text-primary text-2xl transition-colors">close</span>
                </button>
            </div>
            <div class="p-8 flex flex-col gap-6 overflow-y-auto max-h-[75vh]">
                <div class="grid grid-cols-2 gap-x-8 gap-y-6">
                    <div class="flex flex-col gap-2">
                        <label
                            class="text-[11px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider pl-0.5">Fecha</label>
                        <div class="relative">
                            <input
                                class="w-full h-11 pl-4 pr-10 text-sm font-medium glass-input rounded-xl outline-none"
                                type="date" value="2024-01-28" />
                            <span
                                class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xl">calendar_today</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label
                            class="text-[11px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider pl-0.5">Tipo</label>
                        <div
                            class="flex bg-black/5 dark:bg-white/5 p-1 rounded-xl h-11 relative border border-black/5 dark:border-white/10">
                            <div
                                class="absolute right-1 top-1 bottom-1 w-[calc(50%-4px)] bg-primary rounded-lg shadow-sm">
                            </div>
                            <label
                                class="flex-1 relative z-10 flex items-center justify-center cursor-pointer text-sm font-medium text-gray-500 dark:text-gray-300">
                                <input class="hidden" name="type" type="radio" value="income" />
                                Ingreso
                            </label>
                            <label
                                class="flex-1 relative z-10 flex items-center justify-center cursor-pointer text-sm font-bold text-white">
                                <input checked="" class="hidden" name="type" type="radio" value="expense" />
                                Gasto
                            </label>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label
                            class="text-[11px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider pl-0.5">Cuenta</label>
                        <div class="relative">
                            <select
                                class="w-full h-11 pl-4 pr-10 text-sm font-medium glass-input rounded-xl appearance-none outline-none cursor-pointer">
                                <option value="santander">Santander (BANK)</option>
                                <option value="personal">Cartera Personal</option>
                                <option value="business">Cuenta de Negocio</option>
                            </select>
                            <span
                                class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">expand_more</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label
                            class="text-[11px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider pl-0.5">Importe</label>
                        <div class="relative">
                            <input
                                class="w-full h-11 pl-4 pr-4 text-sm font-bold glass-input rounded-xl outline-none placeholder:text-gray-400"
                                placeholder="0.00" step="0.01" type="number" />
                            <span
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm font-bold">€</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label
                            class="text-[11px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider pl-0.5">Descripción</label>
                        <input
                            class="w-full h-11 px-4 text-sm font-medium glass-input rounded-xl outline-none placeholder:text-gray-400"
                            placeholder="Ej: Compra supermercado" type="text" />
                    </div>
                    <div class="flex flex-col gap-2">
                        <label
                            class="text-[11px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider pl-0.5">Categoría</label>
                        <div class="relative">
                            <select
                                class="w-full h-11 pl-4 pr-10 text-sm font-medium glass-input rounded-xl appearance-none outline-none cursor-pointer">
                                <option selected="">Sin categoría</option>
                                <option value="food">Alimentación</option>
                                <option value="transport">Transporte</option>
                                <option value="utilities">Suministros</option>
                                <option value="entertainment">Ocio</option>
                            </select>
                            <span
                                class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">expand_more</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-8 flex justify-between items-center border-t border-[#ff8404]/5">
                <button
                    class="text-sm font-bold text-gray-500 dark:text-gray-400 hover:text-primary transition-colors px-2">Cancelar</button>
                <button
                    class="px-8 py-3 rounded-xl text-sm font-bold bg-primary hover:bg-primary-hover text-white shadow-lg shadow-primary/20 transition-all transform hover:scale-[1.02] active:scale-[0.98] flex items-center gap-2">
                    Guardar Transacción
                </button>
            </div>
        </div>
    </div>
    <style>
        @keyframes fadeInZoom {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>

</body>

</html>
