<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FinanceHub Dashboard (Updated Layout)</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <style type="text/tailwindcss">
        :root {
            --primary-color: #ff8404;
        }
        body { font-family: 'Inter', sans-serif; }
        .sidebar-item-active {
            background-color: var(--primary-color);
            color: white !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#ff8404",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "card-light": "#ffffff",
                        "card-dark": "#1e293b",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.75rem",
                    },
                },
            },
        };
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
    <aside
        class="fixed left-0 top-0 h-full w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 z-50 flex flex-col">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-primary flex items-center gap-2">
                <span class="material-icons-round">account_balance_wallet</span>
                FinanceHub
            </h1>
        </div>
        <nav class="px-4 space-y-1 flex-1">
            <a class="sidebar-item-active flex items-center gap-3 px-4 py-3 rounded-lg font-medium transition-all"
                href="#">
                <span class="material-icons-round">dashboard</span>
                Dashboard
            </a>
            <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg font-medium transition-all group"
                href="#">
                <span class="material-icons-round group-hover:text-primary">swap_horiz</span>
                Movimientos
            </a>
            <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg font-medium transition-all group"
                href="#">
                <span class="material-icons-round group-hover:text-primary">trending_up</span>
                Análisis
            </a>
            <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg font-medium transition-all group"
                href="#">
                <span class="material-icons-round group-hover:text-primary">account_balance</span>
                Bancos
            </a>
            <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg font-medium transition-all group"
                href="#">
                <span class="material-icons-round group-hover:text-primary">corporate_fare</span>
                Entidades
            </a>
            <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg font-medium transition-all group"
                href="#">
                <span class="material-icons-round group-hover:text-primary">category</span>
                Categorías
            </a>
            <div class="pt-6 pb-2 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Configuración
            </div>
            <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg font-medium transition-all group"
                href="#">
                <span class="material-icons-round group-hover:text-primary">settings</span>
                Ajustes
            </a>
        </nav>
        <div class="p-4 border-t border-slate-200 dark:border-slate-800 space-y-4">
            <div class="relative px-2">
                <select
                    class="w-full appearance-none bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2 pr-10 focus:ring-2 focus:ring-primary focus:border-primary cursor-pointer text-sm font-medium">
                    <option>Personal Dashboard</option>
                    <option>Business: Empresa SL</option>
                    <option>+ Añadir Entidad</option>
                </select>
                <span
                    class="material-icons-round absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-base">expand_more</span>
            </div>
            <div class="flex items-center gap-3 px-2 py-2">
                <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-bold">R
                </div>
                <div>
                    <p class="text-sm font-semibold">Rubén</p>
                    <p class="text-xs text-slate-500">Plan Premium</p>
                </div>
            </div>
        </div>
    </aside>
    <main class="ml-64 p-8">
    </main>
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            // document.documentElement.classList.add('dark');
        }
    </script>

</body>

</html>
